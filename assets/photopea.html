<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #1a1a1a; }
        iframe { display: block; width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>
    <iframe id="photopea" title="Photopea editor"></iframe>

    <script>
        const photopeaFrame = document.getElementById('photopea');
        const photopeaConfig = {
            environment: {
                // Keep the important panels available without using permanent
                // canvas space on narrow screens.
                vmode: 1,
                panels: [2, 0], // Layers and History
                customIO: {
                    save: "app.activeDocument.saveToOE('png');"
                }
            }
        };

        photopeaFrame.src =
            `https://www.photopea.com#${encodeURIComponent(JSON.stringify(photopeaConfig))}`;

        function arrayBufferToBase64(buffer) {
            let binary = '';
            const bytes = new Uint8Array(buffer);
            const chunkSize = 0x8000;
            for (let i = 0; i < bytes.length; i += chunkSize) {
                binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
            }
            return btoa(binary);
        }

        window.addEventListener('message', function(e) {
            if (e.source !== photopeaFrame.contentWindow) return;
            if (e.origin !== 'https://www.photopea.com') return;

            if (e.data instanceof ArrayBuffer) {
                const base64 = arrayBufferToBase64(e.data);
                if (window.flutter_inappwebview) {
                    window.flutter_inappwebview.callHandler('onPhotopeaExport', base64);
                }
            } else if (e.data === 'done') {
                if (window.flutter_inappwebview) {
                    window.flutter_inappwebview.callHandler('onPhotopeaEvent', 'done');
                }
            }
        });

        function runPhotopeaScript(script) {
            photopeaFrame.contentWindow.postMessage(script, 'https://www.photopea.com');
        }
        window.runPhotopeaScript = runPhotopeaScript;
    </script>
</body>
</html>
