<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; background: #F4F7FB; }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <iframe id="editorFrame" title="Draw.io diagram editor"></iframe>

  <script>
    const EDITOR_ORIGIN = "https://embed.diagrams.net";
    const editorParams = new URLSearchParams({
      embed: "1",
      proto: "json",
      spin: "1",
      libraries: "1",
      ui: "simple",
      touch: "1",
      dark: "auto",
      gh: "0",
      suppressNewWindows: "1",
    });
    const EDITOR_URL = `${EDITOR_ORIGIN}/?${editorParams.toString()}`;
    const frame = document.getElementById("editorFrame");

    let ready = false;
    let pendingXml = null;

    window.addEventListener("message", function (e) {
      if (e.source !== frame.contentWindow || e.origin !== EDITOR_ORIGIN) return;

      let msg;
      try {
        msg = JSON.parse(e.data);
      } catch (_) {
        return;
      }
      handle(msg);
    });

    function handle(msg) {
      switch (msg.event) {
        case "init":
          ready = true;
          notify("status", "ready");
          send({
            action: "load",
            xml: pendingXml || "<mxGraphModel><root><mxCell id='0'/><mxCell id='1' parent='0'/></root></mxGraphModel>",
          });
          break;

        case "save":
          notify("status", "saving");
          send({ action: "export", format: "xml" });
          send({ action: "export", format: "png" });
          break;

        case "export":
          if (msg.format === "png") {
            notify("png", msg.data);
          } else {
            notify("xml", msg.xml);
          }
          break;
      }
    }

    function send(msg) {
      if (frame.contentWindow) {
        frame.contentWindow.postMessage(JSON.stringify(msg), EDITOR_ORIGIN);
      }
    }

    function notify(type, data) {
      if (window.FlutterBridge) {
        FlutterBridge.postMessage(JSON.stringify({ type: type, data: data }));
      }
    }

    window.openEditor = function (xml) {
      pendingXml = xml || null;
      ready = false;
      frame.src = EDITOR_URL;
    };

    window.loadXmlIntoEditor = function (xml) {
      pendingXml = xml;
      if (ready) {
        send({ action: "load", xml: xml });
      } else {
        window.openEditor(xml);
      }
    };

    window.clearEditor = function () {
      pendingXml = null;
      ready = false;
      frame.src = "";
    };
  </script>
</body>
</html>
